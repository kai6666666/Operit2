name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "versionName"
        required: false
        default: "2.0.0"
      build_number:
        description: "versionCode"
        required: false
        default: "24"

permissions:
  contents: read

jobs:
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential bzip2 ca-certificates curl diffutils flex gawk gzip patch pkg-config tar unzip xz-utils

      - name: Fetch Android runtime sources
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK r29 beta4
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - uses: actions/upload-artifact@v4
        with:
          name: android-runtime
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 3

  apk:
    needs: android-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RUSTFLAGS: -Awarnings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-runtime
          path: apps/flutter/app/android/app/src/main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install FVM
        run: |
          dart pub global activate fvm 4.3.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - name: Install Android SDK, NDK and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev python3-venv
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          SO=$(ls /usr/lib/llvm-*/lib/libclang.so* /usr/lib/x86_64-linux-gnu/libclang-*.so* 2>/dev/null | head -n1)
          sudo ln -sf "$SO" /usr/lib/libclang.so
          echo "OPERIT_LIBCLANG_DIR=/usr/lib" >> "$GITHUB_ENV"

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Prepare node build tools
        run: |
          npm install -g corepack || true
          corepack enable || true
          corepack prepare pnpm@10.7.0 --activate || true
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          .ci-tools/typescript/node_modules/.bin/tsc --version
          cd plugins/packages/buildin/workflow
          corepack pnpm install --frozen-lockfile
          ls -d node_modules/typescript

      - name: Prepare repo python venv
        run: |
          python3 -m venv .venv
          .venv/bin/python --version

      - name: Prepare Android signing
        run: |
          mkdir -p tools/release/secrets
          keytool -genkeypair -v -keystore tools/release/secrets/operit2-release.keystore -storetype PKCS12 -alias operit2 -keyalg RSA -keysize 2048 -validity 10000 -storepass operit2preview -keypass operit2preview -dname "CN=Operit2 Preview,O=Local,C=CN"
          printf '%s\n' \
            'RELEASE_STORE_FILE=operit2-release.keystore' \
            'RELEASE_STORE_PASSWORD=operit2preview' \
            'RELEASE_KEY_ALIAS=operit2' \
            'RELEASE_KEY_PASSWORD=operit2preview' > tools/release/secrets/android-signing.properties
          cat tools/release/secrets/android-signing.properties

      - name: Build release APK (arm64-v8a)
        run: |
          python3 tools/build_scripts/build_flutter_android.py --build-name "${{ inputs.build_name }}" --build-number "${{ inputs.build_number }}" --enforce-lockfile

      - name: Show APK
        run: ls -lh tools/release/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: operit2-apk
          path: tools/release/dist/*.apk
          if-no-files-found: error
          retention-days: 14
